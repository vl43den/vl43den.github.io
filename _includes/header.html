<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}">vl43den</a>
    <nav aria-label="Primary">
      {% assign links = "Open Source|/contributions/,Projects|/projects/,Write-Ups|/writeups/,Blog|/blog/,About|/about/" | split: "," %}
      {% for link in links %}
      {% assign parts = link | split: "|" %}
      <a href="{{ parts[1] | relative_url }}"{% if page.url contains parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
