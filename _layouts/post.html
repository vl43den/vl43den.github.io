---
layout: default
---
<a class="back" href="{{ '/blog/' | relative_url }}">&larr; Blog</a>
<header class="article-head">
  <h1>{{ page.title }}</h1>
  <div class="article-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </div>
</header>
<article class="prose">
  {{ content }}
</article>
