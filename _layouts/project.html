---
layout: default
---
<a class="back" href="{{ '/projects/' | relative_url }}">&larr; Projects</a>
<header class="article-head">
  <h1>{{ page.title }}</h1>
  <div class="article-meta">
    {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y" }}</time>{% endif %}
    {% if page.source %}<a href="{{ page.source }}" target="_blank" rel="noopener">Source code &nearr;</a>{% endif %}
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </div>
</header>
<article class="prose">
  {{ content }}
</article>
